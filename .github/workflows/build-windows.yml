name: Build Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Compile CLI Client
        run: |
          # Navigate specifically to the command-line client folder
          cd cmd/cli
          
          # Build the Windows 64-bit binary
          env GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o ../../slipnet.exe .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipnet-windows-binary
          path: ./slipnet.exe
