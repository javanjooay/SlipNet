name: Build Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Automatically fetches vaydns and other missing dependencies

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Prepare and Build
        run: |
          # 1. Navigate directly to the CLI folder, avoiding mobile constraints
          cd cli
          
          # 2. Create the missing resolvers.txt file that the compiler expects to embed
          echo "8.8.8.8" > resolvers.txt
          
          # 3. Build the Windows executable
          env GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o slipnet.exe .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipnet-windows-binary
          path: ./cli/slipnet.exe
